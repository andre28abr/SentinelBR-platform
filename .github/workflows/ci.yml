name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent:
    name: agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  agent-cross:
    name: agent cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build -o /tmp/sentinel-agent ./cmd/sentinel-agent

  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelbr
          POSTGRES_PASSWORD: sentinelbr
          POSTGRES_DB: sentinelbr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sentinelbr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      loki:
        image: grafana/loki:3.2.0
        ports:
          - 3100:3100
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go vulnerability scan via govulncheck (oficial do projeto Go).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd agent && govulncheck ./...

      # Python: pip-audit cruza pyproject/uv.lock contra OSV.
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit
        working-directory: server
        run: |
          uv sync
          uv pip install pip-audit
          uv run pip-audit --strict

      # JS: npm audit (alta severidade quebra). pnpm audit ainda mais limitado.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm audit
        working-directory: web
        run: pnpm audit --audit-level high
        continue-on-error: true  # avisos de transitive deps nao quebram CI

      # Trivy filesystem scan — pega segredos commitados, IaC misconfig.
      # Instalado via script oficial pra evitar dependencia de versao da action.
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy fs
        run: |
          trivy fs --severity CRITICAL,HIGH --ignore-unfixed --format table --exit-code 0 .

  agent-on-distros:
    name: agent smoke (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: agent
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - debian:12
          - rockylinux:9
          - almalinux:9
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install base deps
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar git; fi
          if command -v dnf >/dev/null; then dnf install -y --allowerasing curl ca-certificates tar gzip git; fi
      - uses: actions/checkout@v4
      - name: Install Go 1.25 from upstream
        shell: bash
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://go.dev/dl/go1.25.0.linux-${ARCH}.tar.gz" -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Build and run agent doctor
        shell: bash
        working-directory: agent
        run: |
          go version
          go build -buildvcs=false -o /tmp/sentinel-agent ./cmd/sentinel-agent
          /tmp/sentinel-agent doctor
