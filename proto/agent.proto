syntax = "proto3";

package sentinelbr.agent.v1;

option go_package = "github.com/sentinelbr/agent/internal/grpc/pb;agentpb";

import "google/protobuf/timestamp.proto";

// AgentService — RPC bidirecional entre agente (host) e server.
// mTLS obrigatório (ADR-005). Cada agente tem cert único.
service AgentService {
  // Enroll é a primeira chamada do agente após instalação.
  // Retorna host_id e config inicial.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Heartbeat — agente manda status a cada N segundos (default 30).
  // Server pode mandar comandos no response (BlockIP, RunCheck, etc.).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // StreamEvents — fluxo contínuo de eventos coletados (logs, alerts).
  rpc StreamEvents(stream Event) returns (stream EventAck);

  // SubmitInventory — agente envia lista de pacotes instalados pra cross-ref
  // com base de vulnerabilidades (OSV/NVD).
  rpc SubmitInventory(InventoryReport) returns (InventoryAck);
}

// ─── Enrollment ───────────────────────────────────────────────────────────────

message EnrollRequest {
  string enrollment_token = 1;  // token one-time gerado no server
  OSInfo os = 2;
  string agent_version = 3;
  string hostname = 4;
}

message EnrollResponse {
  string host_id = 1;        // UUID gerado pelo server
  string client_cert_pem = 2;  // cert assinado pela CA do server
  string client_key_pem = 3;
  AgentConfig config = 4;
}

message OSInfo {
  string family = 1;        // debian | redhat | suse | arch | alpine | windows | darwin
  string distro = 2;
  string version = 3;
  string arch = 4;
  string kernel = 5;
  string package_manager = 6;
  string init_system = 7;
  string firewall_tool = 8;
  string mac_system = 9;
}

message AgentConfig {
  int32 heartbeat_seconds = 1;
  bool collect_journald = 2;
  bool collect_auditd = 3;
  repeated string watch_paths = 4;
}

// ─── Heartbeat ────────────────────────────────────────────────────────────────

message HeartbeatRequest {
  string host_id = 1;
  google.protobuf.Timestamp ts = 2;
  HostStats stats = 3;

  // Resultados de Commands recebidos em heartbeats anteriores. Agente executa
  // localmente (firewall block, etc) e reporta no proximo tick.
  repeated CommandResult command_results = 4;
}

message CommandResult {
  string command_id = 1;
  CommandStatus status = 2;
  string error_message = 3;     // vazio se status == OK
  google.protobuf.Timestamp executed_at = 4;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_OK = 1;
  COMMAND_STATUS_FAILED = 2;
  COMMAND_STATUS_UNSUPPORTED = 3;  // OS/firewall nao suporta a operacao
}

message HostStats {
  double load_avg_1m = 1;
  uint64 mem_used_bytes = 2;
  uint64 mem_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint32 active_alerts = 6;
  string ip_address = 7;       // IP principal do host (eth0/en0)
  uint32 cpu_count = 8;        // numero de cores logicos
  uint64 uptime_seconds = 9;   // uptime do host
  // ClamAV detection
  bool clamav_installed = 10;
  string clamav_version = 11;        // ex: "1.0.4/27295/Wed Mar 6 04:09:31 2024"
  uint32 clamav_db_age_days = 12;    // idade do signature DB em dias
  // Admin panel counts (Fase C)
  uint32 services_running = 13;
  uint32 services_failed = 14;
  uint32 packages_upgradable = 15;
  uint32 listening_ports = 16;
  uint32 cron_jobs = 17;
  // Security tools detection (Fase H1) — toolbox de hardening do host.
  // Cada campo diz se a ferramenta esta instalada/ativa pra UI decidir se
  // mostra painel de interacao.
  bool fail2ban_installed = 18;
  uint32 fail2ban_banned_ips = 19;    // soma de IPs banidos em todos jails
  uint32 fail2ban_jails_active = 20;  // numero de jails configurados
  string firewall_active = 21;        // "ufw" | "firewalld" | "nftables" | "iptables" | ""
  bool auditd_active = 22;
  bool rkhunter_installed = 23;
  bool lynis_installed = 24;
}

message HeartbeatResponse {
  google.protobuf.Timestamp server_ts = 1;
  repeated Command pending_commands = 2;
}

message Command {
  string id = 1;
  oneof payload {
    BlockIPCommand block_ip = 2;
    UnblockIPCommand unblock_ip = 3;
    RunCheckCommand run_check = 4;
    RunYaraScanCommand run_yara_scan = 5;
    QuarantineFileCommand quarantine_file = 6;
    RunClamavScanCommand run_clamav_scan = 7;
  }
}

message RunClamavScanCommand {
  string path = 1;   // diretorio ou arquivo a escanear
  string reason = 2; // ex: "manual_ui", "scheduled"
}

message BlockIPCommand {
  string ip = 1;
  int32 duration_seconds = 2;
  string reason = 3;
}

message UnblockIPCommand {
  string ip = 1;
}

message RunCheckCommand {
  string check_id = 1;
}

message RunYaraScanCommand {
  string path = 1;        // diretorio ou arquivo a escanear
  string reason = 2;      // ex: "manual_ui", "scheduled", "incident_response"
}

message QuarantineFileCommand {
  string file_path = 1;   // caminho absoluto do arquivo malicioso
  string reason = 2;      // ex: "yara_critical_match:WebshellPHP"
}

// ─── Events (stream) ──────────────────────────────────────────────────────────

message Event {
  string event_id = 1;
  string host_id = 2;
  google.protobuf.Timestamp ts = 3;
  string source = 4;     // sshd, auditd, nginx, ...
  string severity = 5;   // debug, info, warn, error, critical
  string raw = 6;
  map<string, string> fields = 7;
}

message EventAck {
  string event_id = 1;
  bool stored = 2;
}

// ─── Inventory ────────────────────────────────────────────────────────────────

message InventoryReport {
  string host_id = 1;
  string source = 2;        // apt | dnf | zypper | pacman | apk
  google.protobuf.Timestamp collected_at = 3;
  repeated PackageInfo packages = 4;
}

message PackageInfo {
  string name = 1;
  string version = 2;
  string arch = 3;          // amd64 | arm64 | noarch
}

message InventoryAck {
  int32 packages_received = 1;
  bool scan_scheduled = 2;
}
