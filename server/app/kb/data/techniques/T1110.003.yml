id: T1110.003
name: Brute Force - Password Spraying
tactic: Credential Access (Acesso a Credenciais)
url: https://attack.mitre.org/techniques/T1110/003/
severity: high
description: |
  Variação do brute-force onde o atacante tenta UMA senha comum
  (password, admin, 123456) contra MUITOS usuários, em vez de muitas
  senhas contra um. Foge de bloqueios de conta (lockout) que disparam
  em N falhas no mesmo user.

  Comum quando o atacante já tem uma lista de e-mails/usuários do alvo
  (vazada em breaches anteriores) e quer testar senhas fracas.

detection:
  rules:
    - ssh_brute_force_ip
    - ssh_user_enumeration
  signals: |
    Mesmo IP fonte tentando login com usuários diferentes em sequência.
    Sentinel correlaciona por source.ip independente de user.name.

mitigation:
  - Mesmo do T1110.001 (chave SSH, MFA, auto-block)
  - Política de senha forte com bloqueio progressivo (aumentar delay após cada falha)
  - Monitorar logins bem-sucedidos de usuários "raros" (admin, postgres, deploy) que costumam ser silenciosos
  - Ter inventário de usuários autorizados — alertar quando user inexistente é tentado

references:
  - https://attack.mitre.org/techniques/T1110/003/

summary_simple:
  what_happened: |
    Alguém tentou uma mesma senha contra muitos usuários diferentes do seu
    servidor. É a versão "esperta" do brute-force: em vez de tentar mil
    senhas no usuário "admin", tenta a senha "password123" em vários
    usuários (admin, root, deploy, ubuntu, postgres...).
  should_worry: |
    Sim, principalmente se você tem usuários com nomes previsíveis. O
    atacante provavelmente conseguiu uma lista de e-mails seus em algum
    vazamento e agora testa senhas fracas.
  what_to_do:
    - Liste seus usuários SSH ativos e revise se algum tem senha óbvia
    - Veja se algum login bem-sucedido aconteceu nessa janela de tempo
    - SentinelBR bloqueou o IP — confira aba "Ações de resposta"
    - Ative MFA pra todos os usuários SSH (libpam-google-authenticator)
  jargon:
    password spraying: "Tentar uma senha comum em muitos usuários — foge dos bloqueios que disparam em N falhas no mesmo user"
    MFA: "Autenticação em 2 fatores — além da senha, precisa de um código do celular"
