id: T1486
name: Data Encrypted for Impact (Ransomware)
tactic: Impact (Impacto)
url: https://attack.mitre.org/techniques/T1486/
severity: critical
description: |
  Ransomware encripta arquivos da vítima e exige resgate (geralmente em
  cripto). A maioria dos ataques no Brasil em SMBs vem por (1) phishing
  com macro Office, (2) RDP exposto com senha fraca, (3) supply chain
  via plugin vulnerável.

  Famílias ativas em 2024-2025: LockBit (Russia), BlackCat/ALPHV, Conti
  (vazada), Royal, Akira. Todas seguem o mesmo padrão: ganhar acesso →
  reconhecer rede → exfiltrar dados → encriptar → deixar nota de resgate.

detection:
  rules:
    - yara_critical_match
  signals: |
    YARA matches em arquivos com padrões de nota de resgate (RECOVER_FILES.txt,
    !!!READ_ME!!!.html, .lockbit, etc) ou binários de famílias conhecidas.
    SentinelBR também alertaria pelo file watcher: massa de WRITEs em
    /home, /var/www em segundos = sinal de encriptação ativa.

mitigation:
  - Backup OFFSITE (3-2-1: 3 cópias, 2 mídias, 1 offsite — rule of thumb)
  - Backups TESTADOS (restore drill mensal) — backup que nunca testou pode estar quebrado
  - Imutabilidade: S3 Object Lock, ZFS snapshots, restic com prune controlado
  - Princípio do menor privilégio: backup user não deve ter delete em destination
  - Patches em dia (foi um dos vetores de Conti — ZeroLogon)
  - Segmentação de rede: VLAN separada pra backup, sem ICMP da DMZ
  - Plano de IR escrito + ensaiado: NÃO PAGAR (estatisticamente, muitos não recebem chave funcionando)

references:
  - https://attack.mitre.org/techniques/T1486/
  - https://www.cisa.gov/stopransomware
  - https://www.gov.br/gsi/pt-br/composicao/dsi/incidentes-em-redes

summary_simple:
  what_happened: |
    Detectamos RANSOMWARE — programa que encripta seus arquivos e exige
    resgate em cripto pra devolver. Famílias ativas no Brasil em 2024-2025:
    LockBit, BlackCat, Akira, Royal. Geralmente entra por phishing ou RDP
    fraco.
  should_worry: |
    EMERGÊNCIA. Se confirmar que arquivos já estão sendo encriptados,
    DESCONECTE o servidor da rede AGORA (antes que se espalhe pra outros
    servidores). Não pague o resgate — estatisticamente, muitos não recebem
    chave funcionando.
  what_to_do:
    - "1. DESLIGA o cabo de rede / desativa interface (ip link set eth0 down)"
    - "2. NÃO desliga o servidor (memória pode ter chaves de descriptografia)"
    - "3. Tira foto/snapshot do estado pra forensics"
    - "4. Restaure de backup OFFSITE — testado, imutável (não é backup que rodou só de ontem)"
    - "5. Reporta ao CTIR.gov.br: incidentes@ctir.gov.br"
    - "6. Polícia: SSP/Federal — pra registrar BO"
    - "Plano de IR: NÃO PAGAR. Recupera de backup. Investiga como entrou"
  jargon:
    ransomware: "Tipo de malware que sequestra seus arquivos encriptando eles. Pede dinheiro pra devolver"
    LGPD Art. 48: "Lei brasileira que OBRIGA notificar a ANPD em caso de vazamento — ransomware geralmente vaza dados"
    CTIR: "Centro de Tratamento de Incidentes do governo brasileiro — você deve reportar incidentes graves"
    backup OFFSITE: "Backup em outro lugar físico/cloud, separado da rede principal — ransomware não consegue alcançar"
