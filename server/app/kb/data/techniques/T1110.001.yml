id: T1110.001
name: Brute Force - Adivinhação de Senha
tactic: Credential Access (Acesso a Credenciais)
url: https://attack.mitre.org/techniques/T1110/001/
severity: high
description: |
  Atacante tenta adivinhar senhas válidas em loop, geralmente via SSH, RDP,
  SMB ou serviços web. Em SMBs brasileiras o vetor mais comum é SSH exposto
  na internet sem fail2ban, com dicionários conhecidos (admin, root, postgres,
  password123).

  O ataque é "barulhento": gera dezenas/centenas de tentativas falhas em
  poucos segundos, fácil de detectar via log de autenticação.

detection:
  rules:
    - ssh_brute_force_ip
    - ssh_brute_force_user
  signals: |
    Múltiplas linhas "Failed password" no /var/log/auth.log do mesmo source
    IP em janela curta (5+ em 5 min).

mitigation:
  - Desabilitar autenticação por senha SSH (PasswordAuthentication no), aceitar só chave
  - SentinelBR auto-block via firewall após detecção (já configurado)
  - Mover SSH pra porta não-padrão (reduz volume de scans automatizados, não para alvos direcionados)
  - Fail2ban ou crowdsec como segunda linha de defesa
  - VPN ou bastion na frente do SSH em vez de exposição direta
  - MFA com Google Authenticator (libpam-google-authenticator) ou Yubikey

references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-074a

summary_simple:
  what_happened: |
    Alguém tentou várias senhas SSH no seu servidor pra entrar. Robôs fazem
    isso o tempo todo varrendo a internet: vão chutando senhas comuns
    (admin, root, password, 123456) até acertar.
  should_worry: |
    Sim. Se sua senha for fraca, eventualmente eles entram. Volume alto
    (12+ tentativas em minutos) significa que tem alguém testando ativamente
    no seu servidor agora.
  what_to_do:
    - "Verifique se algum login deu certo: rode `grep \"Accepted\" /var/log/auth.log` no servidor"
    - O SentinelBR já bloqueou o IP no firewall (veja aba "Ações de resposta")
    - Considere desabilitar senha SSH e usar só chave (PasswordAuthentication no em /etc/ssh/sshd_config)
    - Confirme que sua conta de admin tem senha forte (mínimo 16 caracteres aleatórios)
  jargon:
    brute-force: "Atacante tenta milhares de senhas em sequência até uma funcionar"
    auth.log: "Arquivo onde o Linux registra todas as tentativas de login (sucessos e falhas)"
    SSH: "Protocolo que permite acessar e controlar o servidor remotamente via terminal"
