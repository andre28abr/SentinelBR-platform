id: T1505.003
name: Server Software Component - Web Shell
tactic: Persistence (Persistência)
url: https://attack.mitre.org/techniques/T1505/003/
severity: critical
description: |
  Atacante coloca um arquivo executável remoto (PHP, JSP, ASPX) num
  diretório acessível pelo web server. Permite executar comandos
  arbitrários via HTTP — backdoor persistente que sobrevive a reboot
  e patch da vulnerabilidade original.

  No Brasil, vetor super comum em sites WordPress/Joomla mal-mantidos:
  exploit de plugin vulnerável → upload de webshell em wp-content/uploads/
  → atacante volta semanas depois usando GET ?cmd=...

detection:
  rules:
    - yara_critical_match
    - yara_match_burst
  signals: |
    YARA match em /var/www, /opt/*/uploads, /tmp com regras como
    WebshellPHP (eval, system, base64_decode em PHP). Severidade
    critical — dispara auto-quarantine pela policy.

mitigation:
  - SentinelBR YARA scheduled scan (já configurado, 1x/dia)
  - SentinelBR YARA filewatcher em /var/www (real-time)
  - Auto-quarantine ativo em alertas críticos
  - WAF (mod_security, naxsi) rejeitando payloads conhecidos
  - Inventário do que deveria estar em /var/www — diff contra git
  - Permissões: web user não deve poder escrever fora de uploads/
  - Sandbox uploads (extensões permitidas, validação de magic bytes)

references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://github.com/Yara-Rules/rules/tree/master/webshells

summary_simple:
  what_happened: |
    Encontramos um WEBSHELL no seu servidor — um arquivo PHP/JSP/ASPX
    plantado pelo atacante. Funciona como um "controle remoto" do servidor
    via navegador: o atacante abre a URL e roda qualquer comando.
  should_worry: |
    CRÍTICO. Significa que alguém já invadiu seu servidor (provavelmente
    pelo seu site WordPress/Joomla com plugin vulnerável) e deixou esse
    backdoor pra voltar depois. O ataque inicial pode ter sido semanas atrás.
  what_to_do:
    - O SentinelBR já moveu o arquivo pra quarentena (/var/sentinelbr/quarantine/)
    - "Veja o IP que ESTAVA acessando esse arquivo: grep <nome-do-arquivo> /var/log/nginx/access.log"
    - Atualize TODOS os plugins/temas do WordPress/Joomla
    - Considere reinstalar o servidor do zero (atacante pode ter outros backdoors)
    - "Restaure backup ANTERIOR à invasão (se confirmar a data)"
    - "Troque TODAS as senhas e chaves SSH/API"
  jargon:
    webshell: "Arquivo malicioso que dá controle remoto do servidor via navegador. Backdoor persistente."
    backdoor: "Entrada secreta deixada pelo atacante pra voltar depois, mesmo se você corrigir a falha original"
    quarentena: "Pasta isolada onde arquivos maliciosos ficam sem poder ser executados, mas você ainda pode investigar"
