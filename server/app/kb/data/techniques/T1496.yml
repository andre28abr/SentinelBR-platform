id: T1496
name: Resource Hijacking (Cryptojacking)
tactic: Impact (Impacto)
url: https://attack.mitre.org/techniques/T1496/
severity: high
description: |
  Atacante usa recursos do servidor comprometido pra minerar criptomoeda
  (Monero é a queridinha — algoritmo RandomX roda bem em CPU). Vítima vê
  CPU 100%, conta de eletricidade/cloud explodindo, mas o sistema fica
  "funcionando" — atacante quer manter discreto.

  Indicadores: processo xmrig/cgmining/minerd, conexão pra pools
  (pool.minexmr.com:4444, pool.supportxmr.com), arquivo de config com
  wallet address, cron suspeito ressuscitando o miner se você matar.

detection:
  rules:
    - yara_critical_match
    - yara_match_burst
  signals: |
    YARA matches em arquivos de config do XMRig (donate-level, algo: rx/0,
    stratum+tcp). Em vuln-lab tem exemplo em /tmp/lab-bait/xmrig.json.

mitigation:
  - SentinelBR YARA scan + auto-quarantine
  - Bloquear ranges conhecidos de pools no firewall (lista feed feeds.dnsbl.cm)
  - Monitor de CPU sustentada >80% por mais de 30min em servidor que não roda batch
  - Auditd em execve pra processos não-listados
  - Container/VM com cgroup limits pra evitar dano em caso de comprometimento

references:
  - https://attack.mitre.org/techniques/T1496/
  - https://github.com/xmrig/xmrig

summary_simple:
  what_happened: |
    Encontramos um MINERADOR DE CRIPTOMOEDA no seu servidor. O atacante
    invadiu, deixou um programinha que minera Monero (ou outra cripto) 24/7
    usando SEU servidor — e o lucro vai pra carteira dele.
  should_worry: |
    Sim. Não é "só" sobre custo elétrico — significa que alguém INVADIU
    seu servidor. Se conseguiu plantar miner, conseguiu plantar webshell,
    keylogger, etc. Investigue como entrou.
  what_to_do:
    - Confirme se o miner está rodando como processo (ps aux | grep -E "xmrig|cgmining|minerd")
    - "Veja CPU média: top — se ficou em 90%+ por dias é o miner ativo"
    - O SentinelBR já quarantinou o config — agora mate o processo se ainda roda
    - "Verifique cron e systemd: o miner pode ter agendamento pra ressuscitar (crontab -l, systemctl list-timers)"
    - Auditar quem teve acesso SSH recente
    - Considerar reinstalar o servidor
  jargon:
    cryptojacking: "Usar servidor invadido pra minerar cripto. Comum porque é silencioso (atacante quer ficar discreto)"
    Monero: "Criptomoeda focada em privacidade — favorita de atacantes porque é difícil rastrear"
    miner: "Programa que faz cálculos pesados pra ganhar cripto. Consome 90%+ de CPU"
