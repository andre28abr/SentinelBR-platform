# Explicacoes leigas por event.source — usado no popover ⓘ da aba Eventos.
# Cada entry pode ter:
#   title: nome curto que aparece como header
#   what: 1-3 frases explicando de onde veio o evento + por que importa
#   fields: dicionario {field_key -> descricao} pra renderizar nomes amigaveis
#           nos fields parseados (ex: "source.ip" vira "IP de origem")

sshd:
  title: Evento de autenticação SSH
  what: |
    Linha do arquivo /var/log/auth.log do Linux, gerada pelo daemon SSH quando
    alguém tenta logar. Inclui sucessos (Accepted) e falhas (Failed). Cada
    tentativa de login no servidor passa por aqui — é a primeira fonte que
    o SentinelBR olha pra detectar ataques de força bruta.
  fields:
    "event.action": Tipo da tentativa
    "event.outcome": Resultado
    "event.reason": Motivo da falha
    "user.name": Usuário
    "user.valid": Usuário existe no sistema?
    "source.ip": IP de origem
    "source.port": Porta de origem
    "auth.method": Método de autenticação
    "process.name": Processo

yara:
  title: Match YARA — arquivo suspeito detectado
  what: |
    O agente escaneou um arquivo no host e ele bateu com uma regra YARA
    (assinatura de malware). Pode ser webshell, miner, ransomware,
    backdoor — depende da regra que casou. Severity critical dispara
    auto-quarentena pela policy.
  fields:
    "event.action": Tipo do evento
    "event.outcome": Resultado
    "event.category": Categoria
    "yara.rule_name": Regra que casou
    "yara.severity": Severidade da regra
    "yara.tags": Tags da regra
    "yara.scan_reason": Por que rodou (manual_ui, scheduled, filewatcher)
    "file.path": Caminho do arquivo

selinux:
  title: Denial do SELinux (mandatory access control)
  what: |
    O SELinux negou uma operação que estava fora do perfil esperado de um
    processo. Em servidor saudável, esses denials são raros. Burst do mesmo
    source_type pode indicar exploit ou misconfiguration.
  fields:
    "selinux.source_type": Contexto do processo
    "selinux.target_type": Contexto do recurso alvo
    "selinux.target_class": Classe do recurso (file, dir, socket...)
    "selinux.permission": Permissão negada
    "process.name": Processo

apparmor:
  title: Denial do AppArmor (mandatory access control)
  what: |
    O AppArmor negou uma operação fora do perfil do processo. Equivalente
    do SELinux para Ubuntu/Debian. Burst do mesmo profile pode indicar
    exploit ou perfil desatualizado.
  fields:
    "apparmor.profile": Perfil do processo
    "apparmor.operation": Operação negada
    "apparmor.name": Recurso alvo
    "process.name": Processo

quarantine:
  title: Arquivo movido para quarentena
  what: |
    O agente moveu um arquivo malicioso da localização original para a pasta
    /var/sentinelbr/quarantine/. O arquivo continua existindo (pra forensics)
    mas não pode mais ser executado. Hash sha256 calculado e gravado em
    sidecar JSON.
  fields:
    "event.action": Ação executada
    "event.outcome": Resultado
    "file.path": Caminho original
    "file.hash.sha256": SHA256 do arquivo
    "quarantine.path": Destino na quarentena
    "quarantine.reason": Por que foi quarantinado

clamav:
  title: Scan ClamAV — antivírus
  what: |
    Resultado de um scan disparado pelo ClamAV (antivírus tradicional). Os
    eventos vêm em duas formas: 1 evento "scan_completed" no fim de cada
    scan (informativo, mostra quantos matches), e 1 evento "clamav_match"
    crítico por arquivo infectado encontrado.
  fields:
    "event.action": "Tipo do evento (clamav_match, clamav_scan_completed)"
    "event.outcome": "Resultado (alert se infectado, success se limpo)"
    "event.category": Categoria
    "clamav.signature": "Assinatura que casou (ex Win.Trojan.Agent)"
    "clamav.path": Pasta escaneada
    "clamav.matches": Quantidade de arquivos infectados
    "clamav.scan_reason": "Por que rodou (manual_ui, scheduled)"
    "scan.reason": Por que rodou
    "file.path": Caminho do arquivo infectado

fail2ban:
  title: Ação fail2ban (ban/unban de IP)
  what: |
    Registro de quando o agente executou um ban ou unban no fail2ban via
    fail2ban-client. Disparado pela UI ou por policy automática. Use a aba
    Ferramentas → fail2ban pra ver IPs banidos no momento.
  fields:
    "event.action": "Tipo (fail2ban_ban, fail2ban_unban)"
    "event.outcome": Resultado
    "event.category": Categoria
    "fail2ban.jail": "Jail afetado (sshd, apache-auth, etc.)"
    "fail2ban.ip": IP envolvido
    "fail2ban.reason": Motivo

rkhunter:
  title: Resultado do rkhunter (rootkit hunter)
  what: |
    Cada scan emite eventos: 1 "rkhunter_warning" warn por warning encontrado
    + 1 "rkhunter_scan_completed" final. Warnings aparecem em scans periódicos
    (default diário) ou manuais. Em sistema saudável, esperam-se ~0-2 warnings
    falsos positivos comuns (whitelist no /etc/rkhunter.conf).
  fields:
    "event.action": "Tipo (rkhunter_warning, rkhunter_scan_completed)"
    "event.outcome": Resultado
    "event.category": Categoria
    "rkhunter.warnings": "Quantidade de warnings (no completed)"
    "rkhunter.scan_reason": Por que rodou
    "scan.reason": Por que rodou

chkrootkit:
  title: Resultado do chkrootkit (rootkit hunter alternativo)
  what: |
    Detector de rootkits alternativo ao rkhunter — rodam em paralelo geram
    warnings ligeiramente diferentes. Cada scan emite "chkrootkit_warning"
    warn por linha "INFECTED" ou "Warning" no output, + 1 evento final
    "chkrootkit_scan_completed".
  fields:
    "event.action": "Tipo (chkrootkit_warning, chkrootkit_scan_completed)"
    "event.outcome": Resultado
    "event.category": Categoria
    "chkrootkit.warnings": Quantidade de warnings
    "chkrootkit.scan_reason": Por que rodou
    "scan.reason": Por que rodou

lynis:
  title: Auditoria lynis — hardening score
  what: |
    Cada audit gera 1 evento de resumo com o "Hardening index" (0-100) e
    quantidade de findings (warnings + suggestions). Score baixo = muitas
    melhorias possíveis. Use 'lynis show details TEST-ID' no host pra ver
    detalhes de cada finding.
  fields:
    "event.action": lynis_audit
    "event.outcome": Resultado
    "lynis.score": "Hardening index (0-100)"
    "lynis.findings": Quantidade de recomendações
    "lynis.reason": Por que rodou

aide:
  title: AIDE — file integrity check
  what: |
    Compara estado atual contra o database (criado por 'aide --init'). 1
    evento por check com counts de arquivos adicionados, modificados e
    removidos. Em sistema estável esses counts são 0 — qualquer mudança em
    /etc, /usr/bin etc. levanta alerta.
  fields:
    "event.action": aide_check
    "event.outcome": "Resultado (alert se houve diff, success se igual)"
    "aide.added": Arquivos novos detectados
    "aide.changed": Arquivos modificados
    "aide.removed": Arquivos deletados
    "aide.reason": Por que rodou
