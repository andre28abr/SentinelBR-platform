[project]
name = "sentinelbr-server"
version = "0.1.0"
description = "SentinelBR — API central (FastAPI + Celery + Pydantic v2)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "structlog>=24.4.0",
    "grpcio>=1.80.0",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "grpcio-tools>=1.80.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "app/grpc_server/pb",   # codigo gerado pelo protoc, nao mexer
    "alembic/versions",     # migrations sao auto-geradas
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "BLE", "C4", "T20"]
ignore = ["S101"]  # asserts em testes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "N806"]      # senhas hardcoded e nomes de var sao ok em testes
"app/scripts/**" = ["T201", "S105"]        # print() é a interface dos scripts CLI; senhas default ok

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
